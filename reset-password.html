<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | PolyPortal</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7c3aed;
            --secondary: #38bdf8;
            --dark: #07111f;
            --card: rgba(12, 25, 48, 0.78);
            --text: #f8fafc;
            --muted: #a8b3c7;
            --border: rgba(255, 255, 255, 0.12);
            --success: #34d399;
            --error: #fb7185;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 22px;
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.35), transparent 34%),
                radial-gradient(circle at 88% 80%, rgba(56, 189, 248, 0.28), transparent 32%),
                linear-gradient(135deg, #030712, #071426 55%, #0b1022);
        }

        .background-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.28;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(12px);
            opacity: 0.55;
            animation: floatOrb 8s ease-in-out infinite;
        }

        .orb-one {
            width: 180px;
            height: 180px;
            top: 7%;
            left: 8%;
            background: rgba(124, 58, 237, 0.48);
        }

        .orb-two {
            width: 220px;
            height: 220px;
            right: 6%;
            bottom: 5%;
            background: rgba(14, 165, 233, 0.35);
            animation-delay: -3s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
            }

            50% {
                transform: translateY(-24px) translateX(14px) scale(1.08);
            }
        }

        .reset-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 460px;
            animation: cardEntry 0.8s ease both;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(34px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .reset-card {
            position: relative;
            overflow: hidden;
            padding: 38px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--card);
            backdrop-filter: blur(22px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .reset-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--primary),
                var(--secondary),
                transparent
            );
        }

        .back-link {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.25s ease;
        }

        .back-link:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        .icon-box {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 22px;
            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.28),
                    rgba(56, 189, 248, 0.22)
                );
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.14);
            animation: iconPulse 2.8s ease-in-out infinite;
        }

        .icon-box i {
            font-size: 30px;
            background: linear-gradient(135deg, #c4b5fd, #67e8f9);
            .icon-box i {
    font-size: 30px;

    background: linear-gradient(135deg, #c4b5fd, #67e8f9);

    background-clip: text;
    -webkit-background-clip: text;

    color: transparent;
    -webkit-text-fill-color: transparent;
}
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: translateY(0);
                box-shadow: 0 15px 40px rgba(56, 189, 248, 0.14);
            }

            50% {
                transform: translateY(-5px);
                box-shadow: 0 20px 50px rgba(124, 58, 237, 0.24);
            }
        }

        h1 {
            margin-bottom: 10px;
            font-size: clamp(28px, 5vw, 38px);
            line-height: 1.1;
            letter-spacing: -1.2px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.65;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #dbeafe;
            font-size: 13px;
            font-weight: 800;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i:first-child {
            position: absolute;
            top: 50%;
            left: 17px;
            transform: translateY(-50%);
            color: #8292ad;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 56px;
            padding: 0 52px 0 48px;
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 16px;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            background: rgba(4, 12, 27, 0.7);
            transition: 0.25s ease;
        }

        input::placeholder {
            color: #697890;
        }

        input:focus {
            border-color: rgba(56, 189, 248, 0.72);
            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.09),
                0 12px 28px rgba(0, 0, 0, 0.2);
            transform: translateY(-1px);
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            width: 35px;
            height: 35px;
            display: grid;
            place-items: center;
            transform: translateY(-50%);
            border: 0;
            border-radius: 10px;
            color: #94a3b8;
            cursor: pointer;
            background: transparent;
            transition: 0.2s ease;
        }

        .toggle-password:hover {
            color: white;
            background: rgba(255, 255, 255, 0.07);
        }

        .password-meter {
            height: 5px;
            overflow: hidden;
            margin-top: 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
        }

        .password-meter-fill {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.35s ease;
        }

        .password-hint {
            display: block;
            margin-top: 8px;
            color: #7f8da4;
            font-size: 12px;
        }

        .submit-btn {
            position: relative;
            width: 100%;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            margin-top: 8px;
            border: none;
            border-radius: 16px;
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.2px;
            background: linear-gradient(135deg, #7c3aed, #2563eb 55%, #06b6d4);
            box-shadow: 0 16px 35px rgba(37, 99, 235, 0.28);
            transition: 0.25s ease;
        }

        .submit-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            transform: skewX(-22deg);
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.28),
                transparent
            );
            transition: 0.7s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 42px rgba(37, 99, 235, 0.38);
        }

        .submit-btn:hover::before {
            left: 140%;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 13px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.45;
            animation: messageEntry 0.3s ease;
        }

        @keyframes messageEntry {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            display: block;
            color: #a7f3d0;
            border: 1px solid rgba(52, 211, 153, 0.28);
            background: rgba(52, 211, 153, 0.1);
        }

        .message.error {
            display: block;
            color: #fecdd3;
            border: 1px solid rgba(251, 113, 133, 0.28);
            background: rgba(251, 113, 133, 0.1);
        }

        .security-note {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #8290a7;
            font-size: 12px;
            line-height: 1.55;
        }

        .security-note i {
            margin-top: 2px;
            color: #67e8f9;
        }

        .loader {
            width: 18px;
            height: 18px;
            display: none;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 14px;
                align-items: flex-start;
                overflow-y: auto;
            }

            .reset-wrapper {
                margin: 24px 0;
            }

            .reset-card {
                padding: 26px 20px;
                border-radius: 22px;
            }

            .icon-box {
                width: 62px;
                height: 62px;
                border-radius: 18px;
            }

            input,
            .submit-btn {
                height: 53px;
            }
        }
    </style>
</head>

<body>

    <div class="background-grid"></div>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>

    <main class="reset-wrapper">
        <section class="reset-card">

            <a href="/" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                Back to login
            </a>

            <div class="icon-box">
                <i class="fa-solid fa-lock-open"></i>
            </div>

            <h1>Create new password</h1>

            <p class="subtitle">
                Choose a strong password for your account. Your reset link is
                valid for a limited time.
            </p>

            <form id="resetPasswordForm">

                <div class="form-group">
                    <label for="newPassword">New password</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter at least 6 characters"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="newPassword"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    <div class="password-meter">
                        <div
                            class="password-meter-fill"
                            id="passwordMeterFill"
                        ></div>
                    </div>

                    <span class="password-hint" id="passwordHint">
                        Use letters, numbers and symbols for better security.
                    </span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Enter your password again"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitButton">
                    <span id="buttonText">Reset password</span>
                    <i class="fa-solid fa-arrow-right" id="buttonIcon"></i>
                    <span class="loader" id="loader"></span>
                </button>

                <div class="message" id="message"></div>
            </form>

            <div class="security-note">
                <i class="fa-solid fa-shield"></i>

                <span>
                    Your password reset token will become unusable after a
                    successful password reset.
                </span>
            </div>

        </section>
    </main>

    <script>
        const form = document.getElementById("resetPasswordForm");
        const newPasswordInput = document.getElementById("newPassword");
        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const passwordMeterFill =
            document.getElementById("passwordMeterFill");

        const passwordHint = document.getElementById("passwordHint");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");
        const buttonText = document.getElementById("buttonText");
        const buttonIcon = document.getElementById("buttonIcon");
        const loader = document.getElementById("loader");

        document.querySelectorAll(".toggle-password").forEach((button) => {
            button.addEventListener("click", () => {
                const target = document.getElementById(
                    button.dataset.target
                );

                const icon = button.querySelector("i");
                const isPassword = target.type === "password";

                target.type = isPassword ? "text" : "password";

                icon.classList.toggle("fa-eye", !isPassword);
                icon.classList.toggle("fa-eye-slash", isPassword);
            });
        });

        newPasswordInput.addEventListener("input", () => {
            const password = newPasswordInput.value;

            let strength = 0;

            if (password.length >= 6) strength += 25;
            if (password.length >= 10) strength += 20;
            if (/[A-Z]/.test(password)) strength += 20;
            if (/[0-9]/.test(password)) strength += 15;
            if (/[^A-Za-z0-9]/.test(password)) strength += 20;

            passwordMeterFill.style.width =
                Math.min(strength, 100) + "%";

            if (!password) {
                passwordHint.textContent =
                    "Use letters, numbers and symbols for better security.";
            } else if (strength < 45) {
                passwordHint.textContent = "Password strength: Weak";
            } else if (strength < 75) {
                passwordHint.textContent = "Password strength: Good";
            } else {
                passwordHint.textContent = "Password strength: Strong";
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function setLoading(isLoading) {
            submitButton.disabled = isLoading;
            buttonText.textContent = isLoading
                ? "Resetting password..."
                : "Reset password";

            buttonIcon.style.display = isLoading ? "none" : "inline-block";
            loader.style.display = isLoading ? "inline-block" : "none";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.className = "message";
            message.textContent = "";

            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (newPassword.length < 6) {
                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage(
                    "New password and confirm password do not match.",
                    "error"
                );
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");

            if (!token) {
                showMessage(
                    "Reset token is missing. Generate a new reset link.",
                    "error"
                );
                return;
            }

            setLoading(true);

            try {
                const response = await fetch("/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token,
                        newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message || "Password reset failed."
                    );
                }

                showMessage(
                    "Password reset successful. Redirecting to login...",
                    "success"
                );

                form.reset();
                passwordMeterFill.style.width = "0";

                setTimeout(() => {
                    window.location.href = "/";
                }, 1800);
            } catch (error) {
                showMessage(error.message, "error");
            } finally {
                setLoading(false);
            }
        });
    </script>

</body>
</html>
